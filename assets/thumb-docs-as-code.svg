<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100" role="img" aria-labelledby="title desc">
  <title id="title">Docs-as-Code validation and deployment workflow</title>
  <desc id="desc">Markdown enters validation by Vale and MkDocs. A deployment gate allows validated main branch changes to publish to Pages.</desc>
  <rect width="320" height="100" rx="6" fill="#f5f4ed"/>
  <text x="14" y="20" fill="#1b365d" font-family="Georgia, serif" font-size="11" font-weight="600">Docs-as-Code · validate before deploy</text>

  <g font-family="Consolas, monospace" font-size="8" fill="#1b365d">
    <rect x="14" y="39" width="54" height="28" rx="4" fill="#e8e6dc" stroke="#1b365d"/>
    <text x="21" y="56">Markdown</text>

    <rect x="86" y="31" width="84" height="44" rx="5" fill="#e8eef6" stroke="#1b365d"/>
    <text x="99" y="47" font-weight="600">VALIDATE</text>
    <text x="96" y="63">Vale + MkDocs</text>

    <rect x="188" y="39" width="42" height="28" rx="14" fill="#fffdf7" stroke="#b38a58" stroke-width="2"/>
    <text x="198" y="56" fill="#8a673d" font-weight="600">GATE</text>

    <rect x="248" y="39" width="58" height="28" rx="4" fill="#fffdf7" stroke="#1b365d"/>
    <text x="258" y="56">Pages</text>
  </g>

  <g stroke="#1b365d" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M68 53 H86"/>
    <path d="M170 53 H188"/>
    <path d="M230 53 H248"/>
  </g>

  <text x="185" y="84" fill="#6f6b63" font-family="Consolas, monospace" font-size="7">main push + checks passed</text>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#1b365d"/>
    </marker>
  </defs>
</svg>
