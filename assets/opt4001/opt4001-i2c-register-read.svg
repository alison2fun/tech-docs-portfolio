<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">OPT4001YMN I²C 寄存器读取过程</title>
  <desc id="desc">0x45 是七位器件地址。主控先使用写操作设置寄存器指针，再使用读操作依次读取高字节和低字节。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#183b66"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .heading { fill: #183b66; font-size: 25px; font-weight: 700; }
      .label { fill: #183b66; font-size: 24px; font-weight: 700; }
      .sub { fill: #5f6470; font-size: 18px; }
      .mark { fill: #8a612e; font-size: 17px; font-weight: 600; }
    </style>
  </defs>
  <rect x="20" y="20" width="1080" height="400" rx="18" fill="#fbfaf6" stroke="#d9c7a8" stroke-width="2"/>

  <text x="54" y="76" class="heading">地址层级</text>
  <rect x="245" y="42" width="190" height="64" rx="12" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
  <text x="340" y="81" class="label" text-anchor="middle">I²C 总线</text>
  <path d="M435 74 H520" fill="none" stroke="#183b66" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="535" y="42" width="210" height="64" rx="12" fill="#fffaf1" stroke="#b68445" stroke-width="2"/>
  <text x="640" y="70" class="label" text-anchor="middle">器件地址 0x45</text>
  <text x="640" y="95" class="sub" text-anchor="middle">7-bit address</text>
  <path d="M745 74 H830" fill="none" stroke="#183b66" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="845" y="42" width="210" height="64" rx="12" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
  <text x="950" y="81" class="label" text-anchor="middle">OPT4001YMN</text>

  <text x="54" y="178" class="heading">设置寄存器指针</text>
  <text x="245" y="159" class="mark">START</text>
  <rect x="245" y="176" width="250" height="72" rx="12" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
  <text x="370" y="220" class="label" text-anchor="middle">0x45 + Write</text>
  <path d="M495 212 H585" fill="none" stroke="#183b66" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="600" y="176" width="300" height="72" rx="12" fill="#fffaf1" stroke="#b68445" stroke-width="2"/>
  <text x="750" y="220" class="label" text-anchor="middle">Register Address</text>
  <text x="920" y="220" class="mark">Repeated START</text>

  <text x="54" y="328" class="heading">读取 16-bit 数据</text>
  <rect x="245" y="326" width="230" height="76" rx="12" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
  <text x="360" y="372" class="label" text-anchor="middle">0x45 + Read</text>
  <path d="M475 364 H540" fill="none" stroke="#183b66" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="555" y="326" width="190" height="76" rx="12" fill="#fffaf1" stroke="#b68445" stroke-width="2"/>
  <text x="650" y="372" class="label" text-anchor="middle">MSByte</text>
  <path d="M745 364 H810" fill="none" stroke="#183b66" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="825" y="326" width="190" height="76" rx="12" fill="#fffaf1" stroke="#b68445" stroke-width="2"/>
  <text x="920" y="372" class="label" text-anchor="middle">LSByte</text>
  <text x="1028" y="372" class="mark">STOP</text>

</svg>
