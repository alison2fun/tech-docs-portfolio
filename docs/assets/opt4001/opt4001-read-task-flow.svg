<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 280" role="img" aria-labelledby="title desc">
  <title id="title">OPT4001YMN 数据读取任务流程</title>
  <desc id="desc">从找到器件开始，依次启动测量、等待数据、读取结果、确认更新、检查完整性并换算 lux。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#183b66"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .step { fill: #183b66; font-size: 27px; font-weight: 700; }
      .detail { fill: #5f6470; font-size: 20px; }
    </style>
  </defs>
  <rect x="20" y="20" width="1280" height="240" rx="18" fill="#fbfaf6" stroke="#d9c7a8" stroke-width="2"/>

  <g fill="none" stroke="#183b66" stroke-width="3" marker-end="url(#arrow)">
    <path d="M190 140 H210"/><path d="M370 140 H390"/><path d="M550 140 H570"/>
    <path d="M730 140 H750"/><path d="M910 140 H930"/><path d="M1090 140 H1110"/>
  </g>

  <g>
    <rect x="40" y="76" width="150" height="128" rx="14" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
    <text x="115" y="125" class="step" text-anchor="middle">找到器件</text>
    <text x="115" y="166" class="detail" text-anchor="middle">0x45</text>

    <rect x="210" y="76" width="160" height="128" rx="14" fill="#fffaf1" stroke="#b68445" stroke-width="2"/>
    <text x="290" y="125" class="step" text-anchor="middle">启动测量</text>
    <text x="290" y="162" class="detail" text-anchor="middle">OPERATING</text>
    <text x="290" y="188" class="detail" text-anchor="middle">MODE</text>

    <rect x="390" y="76" width="160" height="128" rx="14" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
    <text x="470" y="125" class="step" text-anchor="middle">等待数据</text>
    <text x="470" y="162" class="detail" text-anchor="middle">READY</text>
    <text x="470" y="188" class="detail" text-anchor="middle">FLAG</text>

    <rect x="570" y="76" width="160" height="128" rx="14" fill="#fffaf1" stroke="#b68445" stroke-width="2"/>
    <text x="650" y="125" class="step" text-anchor="middle">读取结果</text>
    <text x="650" y="166" class="detail" text-anchor="middle">0x00 / 0x01</text>

    <rect x="750" y="76" width="160" height="128" rx="14" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
    <text x="830" y="125" class="step" text-anchor="middle">确认更新</text>
    <text x="830" y="166" class="detail" text-anchor="middle">COUNTER</text>

    <rect x="930" y="76" width="160" height="128" rx="14" fill="#fffaf1" stroke="#b68445" stroke-width="2"/>
    <text x="1010" y="125" class="step" text-anchor="middle">检查完整性</text>
    <text x="1010" y="166" class="detail" text-anchor="middle">CRC</text>

    <rect x="1110" y="76" width="170" height="128" rx="14" fill="#e8f0f8" stroke="#183b66" stroke-width="2"/>
    <text x="1195" y="125" class="step" text-anchor="middle">换算 lux</text>
    <text x="1195" y="162" class="detail" text-anchor="middle">EXPONENT</text>
    <text x="1195" y="188" class="detail" text-anchor="middle">MANTISSA</text>
  </g>
</svg>
