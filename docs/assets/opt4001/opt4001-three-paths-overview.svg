<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">OPT4001YMNEVM 的控制、电气和光学链路</title>
  <desc id="desc">控制链路经过 GUI、USB、OPTMBEVM 中的 MSP430 和 I²C 到达 OPT4001YMN；电气链路包含 VDD、GND、SCL 和 SDA；光学链路由环境光经过 FPCB 开孔到达朝向 PCB 的感光区域。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#1b365d"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243145; }
      .lane { font-size: 19px; font-weight: 700; fill: #1b365d; }
      .node { font-size: 16px; font-weight: 650; fill: #1b365d; }
      .sub { font-size: 13px; fill: #6f6b63; }
      .arrow { stroke: #1b365d; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="860" height="520" rx="16" fill="#fffdf7"/>
  <line x1="34" y1="174" x2="826" y2="174" stroke="#ddd7c9"/>
  <line x1="34" y1="334" x2="826" y2="334" stroke="#ddd7c9"/>

  <rect x="34" y="48" width="126" height="82" rx="10" fill="#e8eef6" stroke="#1b365d" stroke-width="2"/>
  <text class="lane" x="97" y="84" text-anchor="middle">控制链路</text>
  <text class="sub" x="97" y="108" text-anchor="middle">命令与数据</text>

  <line class="arrow" x1="254" y1="89" x2="298" y2="89"/>
  <line class="arrow" x1="366" y1="89" x2="410" y2="89"/>
  <line class="arrow" x1="590" y1="89" x2="634" y2="89"/>
  <line class="arrow" x1="702" y1="89" x2="746" y2="89"/>

  <rect x="176" y="58" width="78" height="62" rx="8" fill="#e4ece4" stroke="#5f7e65" stroke-width="2"/>
  <text class="node" x="215" y="94" text-anchor="middle">GUI</text>

  <rect x="298" y="58" width="68" height="62" rx="8" fill="#f3ead8" stroke="#b38a58" stroke-width="2"/>
  <text class="node" x="332" y="94" text-anchor="middle">USB</text>

  <rect x="410" y="40" width="180" height="98" rx="10" fill="#e8eef6" stroke="#1b365d" stroke-width="2"/>
  <text class="node" x="500" y="69" text-anchor="middle">OPTMBEVM 母板</text>
  <rect x="451" y="82" width="98" height="36" rx="6" fill="#fffdf7" stroke="#1b365d"/>
  <text class="node" x="500" y="106" text-anchor="middle">MSP430</text>

  <rect x="634" y="58" width="68" height="62" rx="8" fill="#f3ead8" stroke="#b38a58" stroke-width="2"/>
  <text class="node" x="668" y="94" text-anchor="middle">I²C</text>

  <rect x="746" y="48" width="80" height="82" rx="10" fill="#e4ece4" stroke="#5f7e65" stroke-width="2"/>
  <text class="node" x="786" y="83" text-anchor="middle">OPT4001</text>
  <text class="sub" x="786" y="107" text-anchor="middle">YMN</text>

  <rect x="34" y="211" width="126" height="82" rx="10" fill="#f3ead8" stroke="#b38a58" stroke-width="2"/>
  <text class="lane" x="97" y="247" text-anchor="middle">电气链路</text>
  <text class="sub" x="97" y="271" text-anchor="middle">供电与通信</text>

  <rect x="206" y="214" width="456" height="76" rx="10" fill="#fffdf7" stroke="#b38a58" stroke-width="2"/>
  <rect x="228" y="233" width="82" height="38" rx="19" fill="#f3ead8"/>
  <rect x="338" y="233" width="82" height="38" rx="19" fill="#f3ead8"/>
  <rect x="448" y="233" width="82" height="38" rx="19" fill="#f3ead8"/>
  <rect x="558" y="233" width="82" height="38" rx="19" fill="#f3ead8"/>
  <text class="node" x="269" y="258" text-anchor="middle">VDD</text>
  <text class="node" x="379" y="258" text-anchor="middle">GND</text>
  <text class="node" x="489" y="258" text-anchor="middle">SCL</text>
  <text class="node" x="599" y="258" text-anchor="middle">SDA</text>
  <line class="arrow" x1="662" y1="252" x2="746" y2="252"/>
  <rect x="746" y="211" width="80" height="82" rx="10" fill="#e4ece4" stroke="#5f7e65" stroke-width="2"/>
  <text class="node" x="786" y="246" text-anchor="middle">OPT4001</text>
  <text class="sub" x="786" y="270" text-anchor="middle">YMN</text>

  <rect x="34" y="374" width="126" height="82" rx="10" fill="#e4ece4" stroke="#5f7e65" stroke-width="2"/>
  <text class="lane" x="97" y="410" text-anchor="middle">光学链路</text>
  <text class="sub" x="97" y="434" text-anchor="middle">环境光进入</text>

  <line class="arrow" x1="310" y1="415" x2="376" y2="415"/>
  <line class="arrow" x1="570" y1="415" x2="636" y2="415"/>
  <rect x="198" y="384" width="112" height="62" rx="31" fill="#fff4d9" stroke="#b38a58" stroke-width="2"/>
  <text class="node" x="254" y="420" text-anchor="middle">环境光</text>

  <rect x="376" y="374" width="194" height="82" rx="10" fill="#e4ece4" stroke="#5f7e65" stroke-width="2"/>
  <text class="node" x="473" y="408" text-anchor="middle">FPCB 开孔</text>
  <text class="sub" x="473" y="432" text-anchor="middle">保留进光路径</text>

  <rect x="636" y="374" width="190" height="82" rx="10" fill="#e8eef6" stroke="#1b365d" stroke-width="2"/>
  <text class="node" x="731" y="408" text-anchor="middle">OPT4001YMN</text>
  <text class="sub" x="731" y="432" text-anchor="middle">朝向 PCB 的感光区域</text>
</svg>
