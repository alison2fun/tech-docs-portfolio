site_name: 梁卓雯｜技术文档作品集

# 1. 优化主题色与导航体验
theme:
  name: material
  # Kami 风格使用暖白底和墨蓝强调；同时提供夜间模式
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到夜间模式
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到日间模式
  features:
    - navigation.tabs          # 【核心】开启顶部导航 Tab，让侧边栏变清爽
    - navigation.tabs.sticky   # 顶部导航在向下滚动时吸顶
    # - navigation.sections      # 侧边栏主分类加粗，层级更分明
    - navigation.top           # 右下角增加“回到顶部”按钮
    - search.suggest           # 搜索输入提示
    - search.highlight         # 搜索结果高亮
    - content.code.copy        # 【核心】为代码块添加“一键复制”按钮
    - content.tabs.link        # 同步页面中使用相同标签的系统选项

# 2. 引入自定义 CSS（带版本号文件名，避免 GitHub Pages/CDN 缓存旧样式）
extra_css:
  - styles/kami-portfolio-20260709.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/download-links.js

# 3. 开启必要的 Markdown 扩展（为了支持截图控制和更好的排版）
markdown_extensions:
  - attr_list                # 【核心】允许在 Markdown 中为图片添加 class 类名
  - md_in_html               # 允许在 HTML 标签内写 Markdown
  - tables                   # 确保表格正常渲染
  - toc:
      toc_depth: 2           # 右侧目录只展示页面主任务，避免结构标签挤占导航
  - admonition               # 支持 Note/Warning 等提示块
  - pymdownx.details         # 支持 ??? 可展开/折叠提示块
  - pymdownx.tabbed:
      alternate_style: true  # 把平台选项渲染为可点击的内容标签
  - pymdownx.highlight       # 代码高亮基础支持
  - pymdownx.superfences:    # 支持更复杂的代码块嵌套，并把 Mermaid 代码块渲染为图表容器
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# 旧入口、迁移页和完整拆解目录中的非重点文章仍需保留 URL，
# 但不重复占用左侧主导航。
not_in_nav: |
  /05-miniprogram-task-decomposer/**
  /case-studies/apple-swiftui-tutorials.md
  /case-studies/docker-workshop.md
  /case-studies/github-hello-world.md
